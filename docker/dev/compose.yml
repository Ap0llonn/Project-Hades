
services:
  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:9fyGqSTttKL5CHUbkw8E7dsG5OX0j7WB/GaWhz3V/jo="
    command: ["php-fpm"]
    volumes:
      - ../../:/var/www/html
    networks:
      - web
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    volumes:
      - ../../:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # Main domain
      - "traefik.http.routers.vaultguardian.rule=Host(`vaultguardian.test`)"
      - "traefik.http.routers.vaultguardian.entrypoints=websecure"
      - "traefik.http.routers.vaultguardian.tls=true"
      - "traefik.http.routers.vaultguardian.service=vaultguardian-service"

      # Subdomain
      - "traefik.http.routers.vault.rule=Host(`vault.vaultguardian.test`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      - "traefik.http.routers.vault.service=vault-service"

      # Services (both point to nginx port 80)
      - "traefik.http.services.vaultguardian-service.loadbalancer.server.port=80"
      - "traefik.http.services.vault-service.loadbalancer.server.port=80"

  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web

  worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--sleep=1", "--tries=3", "--timeout=120"]
    volumes:
      - ../../:/var/www/html
    networks:
      - web
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"
    networks:
      - web

networks:
  web:
    external: true

volumes:
  pgdata:
