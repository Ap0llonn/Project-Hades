version: "3.9"

services:
  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: app

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      LOG_CHANNEL: stderr

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}

      CACHE_STORE: ${CACHE_STORE}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: nginx

    restart: unless-stopped

    depends_on:
      - app

  worker:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: app

    restart: unless-stopped

    command:
      - php
      - artisan
      - queue:work
      - database
      - --queue=default
      - --sleep=1
      - --tries=3
      - --timeout=120
      - --no-interaction

    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}

      LOG_CHANNEL: stderr

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}

      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
