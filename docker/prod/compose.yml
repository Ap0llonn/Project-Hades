version: "3.9"

services:
  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: app

    restart: unless-stopped

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr

    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: nginx

    restart: unless-stopped

    depends_on:
      - app

  worker:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: app

    restart: unless-stopped

    command:
      - php
      - artisan
      - queue:work
      - database
      - --queue=default
      - --sleep=1
      - --tries=3
      - --timeout=120
      - --no-interaction

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: vaultGuardian
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U admin -d vaultGuardian

      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
