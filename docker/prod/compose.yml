services:
  app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web

  nginx:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: nginx
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - web

  worker:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    command:
      - php
      - artisan
      - queue:work
      - database
      - --queue=default
      - --sleep=1
      - --tries=3
      - --timeout=120
      - --no-interaction
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  pgdata:
